# Run from the repository root. A separate project name prevents unrelated cleanup.
services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      WEEK10_RELEASE: v1
      WEEK10_LOG_STDOUT: "1"
    ports:
      - "127.0.0.1:${WEEK10_APP_PORT:-8010}:8010"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2h
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${WEEK10_PROMETHEUS_PORT:-9090}:9090"
    read_only: true
    tmpfs:
      - /prometheus:uid=65534,gid=65534
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy
