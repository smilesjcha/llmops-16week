<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>교수용 발표자 노트 · 11주차</title><link rel="stylesheet" href="presenter.css"></head>
<body>
<header class="top"><strong>교수용 발표자 노트</strong><p id="connection" role="status" aria-live="polite">강의 창 연결 대기</p></header>
<div class="share-guide"><strong>학생에게는 강의 창만 공유하세요.</strong> 발표자 창은 공유하지 않는 모니터나 별도 창에 둡니다.</div>
<noscript><p class="empty">자동 동기화를 사용하려면 JavaScript를 켜세요.</p></noscript>
<main>
<section id="waiting" class="empty"><h1>강의 창에서 발표자 모드 시작</h1><p>원래 강의 창의 <strong>발표자 모드</strong> 버튼으로 이 창을 열면 현재 장표와 연결됩니다. 강의 창은 P 또는 전체 화면 버튼으로 발표합니다.</p><a href="index.html" target="_blank" rel="noopener">강의안 열기</a> · <a href="instructor/index.html" target="_blank" rel="noopener">전체 강의 준비 자료</a></section>
<div id="workspace" hidden>
<header class="current"><p><span id="position"></span><span id="chapter"></span></p><h1 id="slide-title"></h1></header>
<div class="page-tools"><form id="jump-form"><label for="jump">페이지</label><input id="jump" type="number" min="1" max="64" value="1" data-control disabled><button data-control disabled>이동</button></form><label for="outline" class="sr-only">목차에서 장표 선택</label><select id="outline" data-control disabled></select><a id="full-note" href="instructor/index.html" target="_blank" rel="noopener">상세 설명</a></div>
<div class="layout">
<aside class="visual-pane" aria-label="장표 미리보기">
<figure class="preview-card"><figcaption><strong id="current-preview-label">현재 장표</strong><button id="expand-current" disabled aria-haspopup="dialog">확대</button></figcaption><div id="current-stage" class="preview-stage" aria-busy="true"><iframe id="current-preview" title="현재 장표 미리보기" sandbox="allow-scripts" tabindex="-1" aria-hidden="true"></iframe><p class="preview-loading">현재 장표 연결 대기</p></div></figure>

<figure class="preview-card next-card"><figcaption><strong id="next-preview-label">다음 장표</strong><button id="expand-next" disabled aria-haspopup="dialog">확대</button></figcaption><p id="next-title"></p><div id="next-stage" class="preview-stage" aria-busy="true"><iframe id="next-preview" title="다음 장표 미리보기" sandbox="allow-scripts" tabindex="-1" aria-hidden="true"></iframe><p class="preview-loading">다음 장표 연결 대기</p></div><p id="preview-end" hidden>마지막 장표입니다.</p></figure>
</aside>
<section class="notes-pane" aria-label="교수 설명 노트">
<div class="notes-toolbar"><strong>설명 노트</strong><div class="font-controls"><button id="font-smaller" type="button" aria-label="노트 글씨 축소">A−</button><label for="font-size" class="sr-only">설명 노트 글씨 크기</label><input id="font-size" type="range" min="16" max="36" step="1" value="22"><output id="font-value" for="font-size">22px</output><button id="font-larger" type="button" aria-label="노트 글씨 확대">A+</button><button id="font-reset" type="button">기본</button></div></div>
<article id="notes" tabindex="0" aria-label="현재 장표 설명 노트. 내부를 스크롤해 계속 읽을 수 있습니다."></article>
<section id="flow" hidden><h2>현재 도식 단계</h2><p id="flow-caption"></p><div class="flow-buttons"><button id="flow-back" data-control disabled>이전 단계</button><button id="flow-next" data-control disabled>다음 단계</button><button id="flow-reset" data-control disabled>전체 보기</button></div></section>
<p class="help">노트 영역을 스크롤해 계속 읽기 · ← / → 장표 이동 · F 도식 진행</p>
</section>
</div>
</div>
</main>
<footer class="controls"><button id="previous" data-control disabled>이전 장표</button><span id="footer-position">— / —</span><button id="next" data-control disabled>다음 장표</button><button id="audience-focus" data-control disabled>강의 창 보기</button><button id="end" data-control disabled>발표자 모드 종료</button></footer>
<dialog id="preview-dialog" aria-labelledby="preview-dialog-title"><header><h2 id="preview-dialog-title">장표 미리보기</h2><button id="preview-close" type="button">닫기</button></header><div id="expanded-stage" class="preview-stage" aria-busy="true"><iframe id="expanded-preview" title="확대한 장표 미리보기" sandbox="allow-scripts" tabindex="-1" aria-hidden="true"></iframe><p class="preview-loading">장표 불러오는 중</p></div></dialog>
<script src="presenter.js"></script>
</body></html>
